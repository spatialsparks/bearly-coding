<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">One sprint on autopilot</title>
  <desc id="board-desc">Five stories of sprint S-012 move across a board from Waiting through In progress and In review to Done. Three are built side by side in a first wave, two in a second. Then the whole sprint is reviewed, and only then merged, pushed and deployed.</desc>
  <style>
    svg {
      --bg: #f0f4f1; --lane: #e3eae6; --card: #ffffff; --ink: #12221e; --muted: #51645d;
      --line: #cfd9d4; --honey: #b87f00; --blue: #2a69ad; --green: #27775a; --wash: #fbefcc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0e1816; --lane: #111d1a; --card: #17241f; --ink: #e5eee9; --muted: #9bafa7;
        --line: #2b3c36; --honey: #f0b62e; --blue: #76aeea; --green: #62c39a; --wash: #3a2f10;
      }
    }
    .bg { fill: var(--bg); }
    .lane { fill: var(--lane); }
    .head { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; }
    .sid { fill: var(--muted); font: 600 13px ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .sprint { fill: var(--ink); font-size: 15px; font-weight: 700; }
    .pill { fill: var(--wash); }
    .pill-text { fill: var(--honey); font-size: 11.5px; font-weight: 600; }
    .box { fill: var(--card); stroke: var(--line); }
    .id { fill: var(--ink); font: 600 11.5px ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .ttl { fill: var(--ink); font-size: 11.5px; }
    .cap { fill: var(--ink); font-size: 13px; opacity: 0; }

    /* Where things stand when nothing animates: the first wave is being built. */
    .w1 { transform: translateX(215px); }
    .d1 { fill: var(--blue); }
    .d2 { fill: var(--muted); }
    #cap1 { opacity: 1; }

    /* One loop is 20 seconds. Wave 1 is cards 1, 2 and 4; wave 2 is cards 3 and 5. */
    .cards { animation: loop 20s linear infinite; }
    .w1, .w2, .d1, .d2, .cap { animation-duration: 20s; animation-iteration-count: infinite; }
    .w1, .w2 { animation-timing-function: ease-in-out; }
    .w1 { animation-name: wave1; }
    .w2 { animation-name: wave2; }
    .d1 { animation-name: dot1; }
    .d2 { animation-name: dot2; }
    #cap1 { animation-name: cap1; } #cap2 { animation-name: cap2; } #cap3 { animation-name: cap3; }
    #cap4 { animation-name: cap4; } #cap5 { animation-name: cap5; }

    @keyframes loop { 0% { opacity: 0; } 2%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes wave1 {
      0%, 13% { transform: translateX(215px); }
      17%, 28% { transform: translateX(430px); }
      32%, 100% { transform: translateX(645px); }
    }
    @keyframes wave2 {
      0%, 28% { transform: translateX(0); }
      32%, 48% { transform: translateX(215px); }
      52%, 63% { transform: translateX(430px); }
      67%, 100% { transform: translateX(645px); }
    }
    @keyframes dot1 {
      0%, 13% { fill: var(--blue); } 17%, 28% { fill: var(--honey); } 32%, 100% { fill: var(--green); }
    }
    @keyframes dot2 {
      0%, 28% { fill: var(--muted); } 32%, 48% { fill: var(--blue); }
      52%, 63% { fill: var(--honey); } 67%, 100% { fill: var(--green); }
    }
    @keyframes cap1 { 0%, 13% { opacity: 1; } 16%, 100% { opacity: 0; } }
    @keyframes cap2 { 0%, 14% { opacity: 0; } 17%, 28% { opacity: 1; } 31%, 100% { opacity: 0; } }
    @keyframes cap3 { 0%, 29% { opacity: 0; } 32%, 48% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes cap4 { 0%, 49% { opacity: 0; } 52%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes cap5 { 0%, 64% { opacity: 0; } 67%, 96% { opacity: 1; } 100% { opacity: 0; } }

    /* Without motion: the picture in the middle of the sprint, and the line that goes with it. */
    @media (prefers-reduced-motion: reduce) {
      .cards, .w1, .w2, .d1, .d2, .cap { animation: none; }
      .w1 { transform: translateX(645px); }
      .w2 { transform: translateX(215px); }
      .d1 { fill: var(--green); }
      .d2 { fill: var(--blue); }
      #cap1 { opacity: 0; }
      #cap3 { opacity: 1; }
    }
  </style>

  <rect class="bg" width="880" height="376" rx="12"/>

  <text class="sid" x="18" y="34">S-012</text>
  <text class="sprint" x="70" y="34">Share links</text>
  <rect class="pill" x="716" y="16" width="146" height="26" rx="13"/>
  <text class="pill-text" x="789" y="33" text-anchor="middle">/autopilot, by itself</text>

  <rect class="lane" x="10" y="54" width="205" height="282" rx="9"/>
  <rect class="lane" x="225" y="54" width="205" height="282" rx="9"/>
  <rect class="lane" x="440" y="54" width="205" height="282" rx="9"/>
  <rect class="lane" x="655" y="54" width="205" height="282" rx="9"/>
  <text class="head" x="22" y="76">WAITING</text>
  <text class="head" x="237" y="76">IN PROGRESS</text>
  <text class="head" x="452" y="76">IN REVIEW</text>
  <text class="head" x="667" y="76">DONE</text>

  <g class="cards">
    <g class="w1">
      <rect class="box" x="18" y="88" width="189" height="42" rx="6"/>
      <circle class="d1" cx="31" cy="103" r="4"/>
      <text class="id" x="41" y="107">S-012.1</text>
      <text class="ttl" x="27" y="123">Links are stored</text>
    </g>
    <g class="w1">
      <rect class="box" x="18" y="136" width="189" height="42" rx="6"/>
      <circle class="d1" cx="31" cy="151" r="4"/>
      <text class="id" x="41" y="155">S-012.2</text>
      <text class="ttl" x="27" y="171">The share dialog opens</text>
    </g>
    <g class="w1">
      <rect class="box" x="18" y="184" width="189" height="42" rx="6"/>
      <circle class="d1" cx="31" cy="199" r="4"/>
      <text class="id" x="41" y="203">S-012.4</text>
      <text class="ttl" x="27" y="219">A link can expire</text>
    </g>
    <g class="w2">
      <rect class="box" x="18" y="232" width="189" height="42" rx="6"/>
      <circle class="d2" cx="31" cy="247" r="4"/>
      <text class="id" x="41" y="251">S-012.3</text>
      <text class="ttl" x="27" y="267">The dialog copies the link</text>
    </g>
    <g class="w2">
      <rect class="box" x="18" y="280" width="189" height="42" rx="6"/>
      <circle class="d2" cx="31" cy="295" r="4"/>
      <text class="id" x="41" y="299">S-012.5</text>
      <text class="ttl" x="27" y="315">An expired link says so</text>
    </g>
  </g>

  <text class="cap" id="cap1" x="18" y="360">Wave 1: three implementers, one story each, each in its own git worktree, test first.</text>
  <text class="cap" id="cap2" x="18" y="360">The wave is checked once: the full verify, then one verifier reads it against its stories.</text>
  <text class="cap" id="cap3" x="18" y="360">Wave 2: the two stories that waited for the first three.</text>
  <text class="cap" id="cap4" x="18" y="360">Checked again. Every story is one commit on the sprint's local branch.</text>
  <text class="cap" id="cap5" x="18" y="360">Two reviewers read the whole sprint. Only then is it merged into main, pushed and deployed.</text>
</svg>
